<meta name="theme-color" content="#1a1326">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lifeline">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap">
<style>
:root{--bg:#1c1c1e;--card:#202a36;--ink:#f1f5f7;--mut:#9fb0ba;--ac:#17c3b8;--gold:#33d65a;--red:#ff6b6b;--line:#33424f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column}
.top{background:#000;padding:10px 14px;display:flex;align-items:center;gap:12px}
.menu{width:34px;height:34px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;font-size:18px}
.logo{font:800 26px/1 "Bricolage Grotesque",system-ui,sans-serif;color:#f26a21;letter-spacing:.5px}
.who{background:#2b3544;padding:8px 12px;display:flex;align-items:center;gap:10px}
.av{width:44px;height:44px;border-radius:50%;background:#8a5a3c;display:grid;place-items:center;font-size:26px;flex:none}
.wi{flex:1;min-width:0}
#name{color:var(--ac);font-weight:800;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#meta{color:var(--ac);font-size:14px;opacity:.85}
.mn{text-align:right}
#money{color:var(--gold);font-weight:800;font-size:22px}
.mn small{color:var(--ac);font-size:12px}
#log{flex:1;overflow-y:auto;padding:8px 14px}
.yr{font-weight:800;font-size:17px;color:var(--ac);margin:16px 0 3px}
.ln{margin:3px 0}
.ln.bad{color:var(--red)}.ln.gold{color:var(--gold)}
nav{background:#012a4a;display:grid;grid-template-columns:1fr 1fr 1.25fr 1fr 1fr;align-items:end;border-top:1px solid #0b4a7a;position:relative}
nav button{background:none;color:var(--ink);border-radius:0;padding:10px 2px 8px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:5px}
nav button i{font-style:normal;width:38px;height:38px;border-radius:50%;background:#17c3b8;display:grid;place-items:center;font-size:18px}
#jobb i{background:#f2862a}
#next{background:#05a02a;color:#fff;width:92px;height:92px;border-radius:50%;border:5px solid #fff;margin:-34px auto 4px;padding:0;gap:0;justify-content:center;font:800 20px/1 "Bricolage Grotesque",system-ui,sans-serif;z-index:2}
#next span{font-size:42px;line-height:.9}
.stats{padding:12px 14px 16px}
.sr{display:flex;align-items:center;gap:10px;margin:6px 0}
.sr em{width:84px;text-align:right;color:var(--ac);font-weight:800;font-style:normal}
.sr u{text-decoration:none;font-size:24px;width:30px;text-align:center}
.sb{flex:1;position:relative;height:24px;background:#3a3a3c;border-radius:3px;overflow:hidden}
.sb b{position:absolute;left:0;top:0;bottom:0;transition:width .4s}
.sb span{position:absolute;right:8px;top:0;line-height:24px;font-weight:800;color:#fff;font-size:14px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 14px;color:var(--ink);background:var(--line)}
button:focus-visible{outline:3px solid #edae49;outline-offset:2px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
#modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:400px;border-radius:20px;padding:20px 16px;max-height:80%;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.5);animation:pop .32s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{font:800 20px "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 6px;color:var(--ac)}
.sheet p{margin:0 0 12px;color:var(--mut)}
.sheet button{display:block;width:100%;text-align:left;margin-top:8px;background:#2b3a49}
.sheet button small{display:block;color:var(--mut);font-size:12px}
.sheet button.p{background:#05a02a;color:#fff;text-align:center;font-weight:800}
#occ,#rls,#mnu,#pg{position:fixed;inset:0;background:#202124;display:none;flex-direction:column;z-index:4;max-width:480px;margin:0 auto;padding-top:env(safe-area-inset-top,0px)}
#occ.on,#rls.on,#mnu.on,#pg.on{display:flex}
.fm{padding:16px}.fm label{display:block;margin:12px 0 4px;color:var(--ac);font-weight:800}
.fm input,.fm select{width:100%;padding:12px;border-radius:10px;border:1px solid #33424f;background:#2b3a49;color:var(--ink);font:inherit}
.fm .go{margin-top:18px;width:100%;background:#05a02a;color:#fff;font-weight:800;text-align:center}
.menu{background:none;color:#fff;padding:0;font-size:18px}
.oh{background:#012a4a;display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid #0b4a7a}
.oh .x{width:34px;height:34px;border:2px solid #fff;border-radius:50%;background:none;padding:0;display:grid;place-items:center;font-size:18px;color:#fff}
.oh h2{flex:1;text-align:center;margin:0 46px 0 0;font:800 22px "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:1px;color:#fff}
.ol{flex:1;overflow-y:auto}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border-radius:0;background:#1f2023;border-bottom:1px solid #33363b;padding:16px 14px;color:var(--ink)}
.row .ic{font-size:34px;width:44px;text-align:center}
.row .tx{flex:1}.row .tx b{display:block;color:#3fb7ff;font-size:20px}.row small{color:#bfe3f7;font-size:15px}
.row .ch{color:#3fb7ff;font-size:30px}
.row.cur{background:#10314d}
.pf{height:8px;background:#3a3a3c;border-radius:4px;margin-top:6px;overflow:hidden}
.pf i{display:block;height:100%;background:#27a844}
#rls .tx b{display:inline}
.rl{color:#bfe3f7;font-weight:400;font-size:19px}
.row small{display:block}
.rb{display:inline-block;width:52%;height:14px;background:#3a3a3c;vertical-align:middle;margin-left:8px;overflow:hidden;border-radius:2px}
.rb i{display:block;height:100%;background:#27a844}
.sec{background:#2b3544;text-align:center;font-weight:700;padding:8px;color:#cdd7de}
.row:disabled{opacity:1}
*{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,select{-webkit-user-select:text;user-select:text}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes fadeIn{from{opacity:0}}
@keyframes lineIn{from{opacity:0;transform:translateY(10px)}}
#occ.on,#rls.on,#mnu.on,#pg.on{animation:slideIn .3s cubic-bezier(.2,.8,.2,1)}
#modal.on{animation:fadeIn .2s ease-out}
.yr,.ln{animation:lineIn .35s ease-out both}
#next{transition:transform .12s}
#next:active{transform:scale(.9)}
.row:active{background:#2a3038}
button{transition:transform .14s cubic-bezier(.34,1.56,.64,1),background .15s}
button:active{transform:scale(.94)}
nav button i{transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
nav button:active i{transform:scale(1.28) rotate(-8deg)}
.row:active{transform:scale(.98)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* mor tema */
:root{--bg:#1a1326;--card:#2a1f3d;--ink:#f3eefc;--mut:#b7a8d1;--ac:#b388ff;--line:#40305c}
.top{background:#0f0a18}
.logo{color:#d8b4fe}
.who{background:#2e2142}
nav{background:#3b1f6b;border-top-color:#5b34a0}
nav button i{background:#9b6bff}
#jobb i{background:#c084fc}
#next{background:#7c3aed}
.sb,.pf,.rb{background:#3a2d52}
.sheet button{background:#3a2b55}
.sheet button.p{background:#7c3aed}
#occ,#rls,#mnu,#pg{background:#1a1326}
.oh{background:#3b1f6b;border-bottom-color:#5b34a0}
.row{background:#231a33;border-bottom-color:#3a2d52}
.row .tx b,.row .ch{color:#c9a7ff}
.row small,.rl{color:#d8c6f5}
.row.cur{background:#3a2366}
.row:active{background:#33274a}
.sec{background:#2e2142;color:#d9cdee}
.fm input,.fm select{background:#3a2b55;border-color:#40305c}
.fm .go{background:#7c3aed}
/* alt panel: avatar solda, ince çubuklar */
.stats{display:flex;align-items:center;gap:14px;padding:8px 14px 12px}
#bars{flex:1;min-width:0}
.stats .av{width:68px;height:68px;font-size:40px;background:linear-gradient(135deg,#7c3aed,#c084fc);border:3px solid #d8b4fe;box-shadow:0 4px 14px rgba(124,58,237,.45)}
.sr{gap:8px;margin:3px 0}
.sr em{width:68px;font-size:12px}
.sr u{font-size:16px;width:20px}
.sb{height:15px;border-radius:8px}
.sb b{border-radius:8px}
.sb span{line-height:15px;font-size:10px;right:6px}
nav button i{background:linear-gradient(135deg,#a78bfa,#7c3aed);box-shadow:0 3px 10px rgba(124,58,237,.5)}
#jobb i{background:linear-gradient(135deg,#f0abfc,#c026d3)}
/* tam ekran menüler */
.ol{padding:10px 12px 16px;display:flex;flex-direction:column;gap:8px}

<script>

const MK="hs_meta";

  o=o&&(o.name!==undefined||o.f!==undefined||o.city!==undefined||o.country!==undefined)?o:{};

     p:0,job:null,uni:false,grad:false,cause:"",dead:false,hist:[],people:[],partner:null,married:false,seen:[],once:[],assets:[],perf:50,worked:false,gigN:0,orient:"straight",cls:[],dept:null,gpa:60,fam:(r=>r<.18?0:r<.8?1:2)(Math.random()),street:false,famPays:false,tyt:0,ayt:0,jail:0};
  S.loc={city:S.city,ctry:S.home};S.people=mkPeople();S.anc=[];S.gp=mkGP();$("log").innerHTML="";

function yr(){const d=document.createElement("div");d.className="yr";dl(d);d.textContent="Yaş: "+S.age;$("log").appendChild(d)}
let _ld=0;const dl=d=>{d.style.animationDelay=(_ld++*.1)+"s";setTimeout(()=>{_ld=0},0)};
function line(t,c){const d=document.createElement("div");d.className="ln "+(c||"");dl(d);d.textContent=t;$("log").appendChild(d);$("log").scrollTop=1e9}
function fxTxt(fx){
  const n={h:"Sağlık",m:"Mutluluk",z:"Zeka",g:"Görünüm"};
  return Object.keys(fx).map(k=>k==="p"?(fx.p>0?"+":"")+TL(fx.p):(fx[k]>0?"+":"")+fx[k]+" "+n[k]).join(", ");
}
function apply(fx){for(const k in fx){if(k==="p")S.p+=fx.p;else S[k]=cl(S[k]+fx[k])}}
function stage(){const a=S.age;if(S.jail>0)return "Hapiste ("+S.jail+" yıl kaldı)";return a<5?"Bebek":a<6?"Anaokulu":a<10?"İlkokul":a<14?"Ortaokul":a<18?"Lise":S.uni?"Üniversite öğrencisi":S.job?S.job.n:a>=65?"Emekli":"İşsiz"}
function render(){
  $("av").textContent=S.f?"👩":"👨";

}
function modal(title,text,btns){

    e.innerHTML="<span></span>"+(b.sub?"<small></small>":"");e.firstChild.textContent=b.t;if(b.sub)e.querySelector("small").textContent=b.sub;

function eventAllowedForAge(ev,age){
  if(age>=18)return true;
  return !ev.worldEvent&&!ev.costsMoney&&!ev.c.some(c=>(c.fx&&c.fx.p<0)||(c.w&&c.w[2]&&c.w[2].p<0));
}
function choose(ev){
  if(!eventAllowedForAge(ev,S.age))return;

  modal(ev.t,typeof ev.d==="function"?ev.d():ev.d,ev.c.map(c=>({t:c.t,sub:c.w?"Riskli":(c.fx?fxTxt(c.fx):""),f:()=>{
    let fx=c.fx||{},m=c.m;
    if(c.w){const p=typeof c.w[0]==="function"?c.w[0]():c.w[0];if(Math.random()<p){m=c.w[1];fx=c.w[2]}}
    apply(fx);
    const tx=fxTxt(fx);
    line(m+(tx?" ("+tx+")":""),(fx.h<0||fx.m<0||fx.p<0)?"bad":"good");

    if(c.run)c.run();
    render();check();}})));
}

<script>

function nextYear(){
  if(!S)return;
  if(S.dead)return;
  S.age++;
  const a=S.age;yr();advanceEconomy();

  // yaş etkileri
  if(a<=20){S.z=cl(S.z+rnd(0,2));if(Math.random()<.3)S.h=cl(S.h+1)}

    if(S.perf<=10&&Math.random()<.5){line("Performansın çok düşük olduğu için "+S.job.n+" işinden çıkarıldın.","bad");S.job=null;S.m=cl(S.m-8)}
    else if(S.perf>=50){const pc=+(Math.min(3,.5+(S.perf-50)/25+Math.random()*.5)).toFixed(2);S.job.s=Math.round(S.job.s*(1+pc/100));line("%"+pc+" zam aldın. Yeni maaşın "+TL(S.job.s)+".","gold")}}
  S.worked=false;S.gigN=0;S.studied=false;S.tytD=false;S.aytD=false;if((S.age>=6&&S.age<18)||(S.uni&&S.dept))S.gpa=cl(S.gpa+rnd(-5,3)+(S.z>70?1:0));
  if(a>=6&&a<18){
    const av=parAvg();
    if(!S.street){if((av<15&&Math.random()<.5)||(S.fam===0&&Math.random()<.04)){S.street=true;apply({m:-15,h:-8});line(av<15?"Ailenle ilişkin çok kötü olduğu için sokağa atıldın. (-15 mutluluk, -8 sağlık)":"Ailen geçinemediği için sokakta kaldın. (-15 mutluluk, -8 sağlık)","bad")}}
    else if(av>=40&&Math.random()<.5){S.street=false;line("Ailen seni geri aldı.","gold")}
    else{apply({h:-6,m:-8,g:-3});line("Sokakta zor bir yıl geçirdin. (-6 sağlık, -8 mutluluk, -3 görünüm)","bad")}
  }
  if(S.street&&!S.housingRequired&&a>=18&&(S.job||S.p>=300000)){S.street=false;line("Kendine kalacak bir yer buldun.","gold")}

  let cost=0,cdesc="";if(a>=18){const y=yearlyCost();cost=y.t;cdesc=y.d}
  
  if(cost){S.p-=cost;line("Yıllık giderler: -"+TL(cost)+(cdesc?" ("+cdesc+")":""))}
  if(S.p<0&&a>=18){S.m=cl(S.m-6);line("Borca girdin, stres yaptı.","bad")}

  if(a===6||a===10||a===14){mkClass(1);line((a===6?"İlkokula":a===10?"Ortaokula":"Liseye")+" başladın. Sınıfında "+S.cls.length+" kişi var.","gold")}
  if(a===18){line("Liseden mezun oldun.","gold");S.cls=[]}
  if(S.uni&&a>=(S.uniEnd||22)&&S.gpa<25){S.uni=false;S.famPays=false;S.cls=[];S.dept=null;line("Notların yetersiz kaldığı için üniversiteden mezun olamadın.","bad");apply({m:-8})}

  // rastgele olay
  const pool=EV.filter(e=>eventAllowedForAge(e,a)&&a>=e.a[0]&&a<=e.a[1]&&!S.once.includes(e.t)&&(!TRO.includes(e.t)||!S.home||S.home==="Türkiye")&&(!e.f||e.f()));
  const fresh=pool.filter(e=>!S.seen.includes(e.t));
  const forced=pool.find(e=>e.a[0]===e.a[1]);
  render();
  if(forced){choose(forced);return}
  if(S.partner&&a>=18&&Math.random()<cheatP()){choose(cheatEv());return}

  line(R(["Sakin bir yıl geçirdin.","Hayat olağan akışında.","Bu yıl pek bir şey olmadı.","Günler birbirini kovaladı."]));

}
function check(){
  render();

  if(a>=60){const p=(a-58)*.012+(S.h<30?.08:0);if(Math.random()<p)die(a>=75?"Yaşlılıktan hayata veda ettin.":"Ani bir sağlık sorunu yaşadın.")}
}

}

function doAct(it){
  if(S.age<it.a)return modal(it.t,it.a+" yaşından sonra yapabilirsin.",[{t:"Kapat",p:1}]);
  if(it.special==="orient")return orientMenu();
  if(it.special==="travel")return travel();
  if(S.jail>0)return modal(it.t,"Hapisteyken bunu yapamazsın.",[{t:"Kapat",p:1}]);
  if(it.crime)return crime(it);
  if(it.special==="kill")return pickTarget(false);
  if(it.special==="hit")return pickTarget(true);
  if(it.cas)return casino(it.cas);
  if(it.gamble){
    const [bet,pr,mul]=it.gamble;
    if(S.p<bet){line("Yeterli paran yok.","bad");return}
    if(Math.random()<pr){const g=Math.round(bet*(mul-1));S.p+=g;line("Kazandın! (+"+TL(g)+")","gold")}
    else{S.p-=bet;S.m=cl(S.m-3);line("Kaybettin. (-"+TL(bet)+", -3 mutluluk)","bad")}
    render();return}
  const cost=S.age>=18?(it.c||0):0;
  if(cost>0&&S.p<cost){line("Yeterli paran yok.","bad");return}
  S.p-=cost;
  let fx=it.fx,msg=it.msg;
  if(it.risk&&Math.random()<it.risk[0]){fx=it.risk[1];msg="İşlem kötü sonuçlandı."}
  apply(fx);
  line(msg+" ("+(cost?"-"+TL(cost)+", ":"")+fxTxt(fx)+")",(fx.h<0||fx.m<0)?"bad":"good");
  render();check();
  if(it.popup&&!S.dead)modal(it.t,msg+" ("+fxTxt(fx)+")",[{t:"Tamam",p:1}]);
}

const pf2=x=>pface({dead:x.dead,pa:x.age,f:x.f});
const tnode=(x,tag,cls)=>`<div class="tn ${cls||""}${x.dead?" dead":""}"><span class="e">${pf2(x)}</span><span class="tt"><b>${esc(x.n)}</b><small>${esc(tag||x.role||"")}${x.age!=null?" · "+x.age+" yaşında"+(x.dead?" · †":""):""}</small></span></div>`;
const tcard=(title,items)=>items.length?`<div class="tg"><h3>${title}</h3>${items.join("")}</div>`:"";
function treeHtml(){
  const A=S.anc||[];
  const cur={me:{n:S.name,f:S.f,age:S.age,dead:S.dead,job:S.job?S.job.n:""},
    spouse:S.partner?{n:S.partner.n,f:pfOf(S.partner),married:S.married,age:null}:null,
    sibs:S.people.filter(x=>/kardeş/.test(x.role)).map(nodeOf),
    kids:S.people.filter(x=>x.role==="Oğul"||x.role==="Kız").map(nodeOf)};
  const G=[...A,cur];
  const parents=A.length?A[0].parents:S.people.filter(x=>x.role==="Anne"||x.role==="Baba").map(nodeOf);
  const gp=A.length?A[0].gp:gpNodes();
  const pn=(x,tag,cls)=>{const ea=x.age!=null?x.age:30;
    return `<div class="fn ${cls||""}${x.dead?" dead":""}"><span class="e">${pface({dead:x.dead,pa:ea,f:x.f})}</span><span class="tt"><b>${esc(x.n)}</b><small>${esc(tag||x.role||"")}${x.age!=null?" · "+x.age+" yaşında"+(x.dead?" · †":""):""}</small></span></div>`};
  const couple=(a,b,mar)=>`<div class="fc">${a}${b?`<div class="hr">${mar?"💍":"♥"}</div>${b}`:""}</div>`;
  const li=(h,ch)=>`<li>${h}${ch&&ch.length?`<ul>${ch.join("")}</ul>`:""}</li>`;
  const leaf=x=>li(couple(pn(x)));
  const meNode=i=>{
    const g=G[i],isCur=i===A.length,me={...g.me,dead:isCur?g.me.dead:true};
    const tag=(isCur?"Sen":"⭐ Oynadığın karakter")+(g.me.job?" · "+g.me.job:"");
    const sp=g.spouse?pn(g.spouse,g.spouse.married?"Eş":"Sevgili"):"";
    const kids=(g.kids||[]).map(k=>(i+1<G.length&&G[i+1].me.n===k.n)?meNode(i+1):leaf(k));
    return li(couple(pn(me,tag,"me"),sp,g.spouse&&g.spouse.married),kids);
  };
  const g0=G[0];
  const sibs=(g0.sibs||[]).map(leaf);
  const par=parents.length?li(couple(pn(parents[0]),parents[1]?pn(parents[1]):""),[...sibs,meNode(0)])
    :null;
  let root;
  if(par&&gp.length){
    const gc=[];for(let i=0;i<gp.length;i+=2)gc.push(couple(pn(gp[i]),gp[i+1]?pn(gp[i+1]):""));
    root=`<li><div class="fg">${gc.join("")}</div><ul>${par}</ul></li>`;
  }else root=par||meNode(0);
  return `<div class="ft"><ul>${root}</ul></div>`;
}

function homeIcon(name){
  const icons={"Köy evi":"🏡","Kırsal müstakil ev":"🌳","Stüdyo daire":"🏢","Daire":"🏙️","Bahçeli müstakil ev":"🌷","Dubleks":"🏘️","Rezidans dairesi":"🌆","Deniz manzaralı yazlık":"🏖️","Çiftlik evi":"🚜","Villa":"🏛️","Taş konak":"🏰","Penthouse":"🌃","Boğaz köşkü":"🌉","Yalı":"🌊"};return icons[name]||"🏠";
}
function syncPropertyUnits(){
  if(!S)return[];
  S.propertyUnits=Array.isArray(S.propertyUnits)?S.propertyUnits:[];S.propertySequence=S.propertySequence||0;
  const counts={};S.assets.filter(n=>HOMES.includes(n)).forEach(n=>counts[n]=(counts[n]||0)+1);
  const kept={};S.propertyUnits=S.propertyUnits.filter(unit=>{kept[unit.name]=(kept[unit.name]||0)+1;return kept[unit.name]<=(counts[unit.name]||0)});
  Object.keys(counts).forEach(name=>{let count=S.propertyUnits.filter(u=>u.name===name).length;while(count++<counts[name])S.propertyUnits.push({id:++S.propertySequence,name,condition:S.cond&&S.cond[name]!=null?S.cond[name]:100,rented:!!(S.rent&&S.rent[name])})});
  return S.propertyUnits;
}
function propertyValue(unit){const x=ALLA.find(a=>a.n===unit.name);return Math.round(x.c*(.55+.45*unit.condition/100)*.85)}
function propertyRent(unit){const x=ALLA.find(a=>a.n===unit.name);return Math.round(x.c*.05*(.5+unit.condition/200))}
function updatePropertyRentFlags(){
  S.rent=S.rent||{};const units=syncPropertyUnits();
  [...new Set(units.map(u=>u.name))].forEach(name=>{if(units.filter(u=>u.name===name).every(u=>u.rented))S.rent[name]=1;else delete S.rent[name]});
}
function collectPropertyRent(){
  if(!S||S.propertyRentAge===S.age)return 0;S.propertyRentAge=S.age;
  let total=0;syncPropertyUnits().filter(u=>u.rented).forEach(unit=>{
    if(Math.random()<.06){line(unit.name+" kiracısı bu yıl ödeme yapmadı.","bad");return}
    if(Math.random()<.1)unit.condition=Math.max(5,unit.condition-rnd(8,18));total+=propertyRent(unit);
  });return total;
}
openMyAssets=function(){
  pgOpen(()=>{
    const units=syncPropertyUnits(),others=S.assets.filter(n=>!HOMES.includes(n)),counts={};
    const total=units.reduce((sum,u)=>sum+propertyValue(u),0),rent=units.filter(u=>u.rented).reduce((sum,u)=>sum+propertyRent(u),0);
    const orderedUnits=units.map(unit=>({unit,number:counts[unit.name]=(counts[unit.name]||0)+1})).sort((a,b)=>propertyValue(b.unit)-propertyValue(a.unit));
    const rows=orderedUnits.map(({unit,number})=>{return{ic:homeIcon(unit.name),t:unit.name+" · "+number,d:"Durum %"+unit.condition+" · Değer "+TL(propertyValue(unit))+" · "+(unit.rented?"Kirada":"Boş"),f:()=>openPropertyUnit(unit.id)}});
    others.forEach(name=>{const x=ALLA.find(a=>a.n===name);if(x)rows.push({ic:"🚗",t:name,d:"Değer "+TL(x.c),f:()=>typeof openOwned==="function"?openOwned(name):null})});
    return{title:"MÜLKLERİM",intro:'<div class="row cur"><span class="ic">🗝️</span><span class="tx"><b>'+units.length+' ev</b><small>Evlerin satış değeri: '+TL(total)+' · Yıllık kira geliri: '+TL(rent)+'</small></span></div>',rows};
  });
};
function openPropertyUnit(id){
  pgOpen(()=>{const units=syncPropertyUnits(),unit=units.find(u=>u.id===id);if(!unit)return{title:"MÜLK",rows:[]};
    const number=units.filter(u=>u.name===unit.name).findIndex(u=>u.id===id)+1,x=ALLA.find(a=>a.n===unit.name),value=propertyValue(unit),repair=Math.max(500,Math.round(x.c*.12*(100-unit.condition)/100));
    return{title:unit.name+" · "+number,intro:'<div class="row cur"><span class="ic">'+homeIcon(unit.name)+'</span><span class="tx"><b>'+esc(unit.name)+' · '+number+'</b><small>Durum %'+unit.condition+' · '+(unit.rented?'Kirada':'Boş')+'</small></span></div>',rows:[
      {ic:"🔑",t:unit.rented?"Kiracıyı çıkar":"Kiraya ver",d:"Yıllık "+TL(propertyRent(unit)),f:()=>{
        if(!syncPropertyUnits().some(u=>u.id===id))return;
        if(!unit.rented&&unit.condition<30)return modal("Kiralama","Önce evi restore etmelisin.",[{t:"Kapat",p:1}]);
        unit.rented=!unit.rented;updatePropertyRentFlags();line(unit.name+" · "+number+(unit.rented?" kiraya verildi.":" kiracısı çıkarıldı."),"good");render();pgDraw();
      }},
      {ic:"🛠️",t:"Restore et",d:unit.condition===100?"Mükemmel durumda":TL(repair),f:()=>{
        if(unit.condition===100)return;
        modal("Restore et","Bu evin bakım bedeli: "+TL(repair),[{t:"Restore et",p:1,f:()=>{
          if(!syncPropertyUnits().some(u=>u.id===id))return;
          if(S.p<repair)return modal("Restore et","Yeterli paran yok.",[{t:"Kapat",p:1}]);S.p-=repair;unit.condition=100;line(unit.name+" · "+number+" restore edildi.","good");render();pgDraw();
        }},{t:"Kapat"}]);
      }},
      {ic:"🏷️",t:"Bu evi sat",d:TL(value),f:()=>modal("Evi sat","Yalnızca "+unit.name+" · "+number+" satılacak. Satış değeri: "+TL(value),[{t:"Sat",p:1,f:()=>{
        if(!syncPropertyUnits().some(u=>u.id===id))return;
        removeOneAsset(unit.name);S.propertyUnits=S.propertyUnits.filter(u=>u.id!==id);S.p+=value;
        if(!assetCount(unit.name)){if(S.rent)delete S.rent[unit.name];if(S.cond)delete S.cond[unit.name]}
        updatePropertyRentFlags();line(unit.name+" · "+number+" satıldı. (+"+TL(value)+")","gold");PG.pop();render();pgDraw();
      }},{t:"Kapat"}])}
    ]};
  });
}

pgOpen=function(builder){return pgOpenBeforePropertyUnits(()=>{const page=builder();
  if(page.rows)page.rows.forEach(row=>{if(HOMES.includes(row.t))row.ic=homeIcon(row.t)});
  if(page.title==="VARLIKLAR"&&!page.rows.some(row=>row.ic==="🗝️"))page.rows.unshift({ic:"🗝️",t:"Mülklerim",d:"Evlerini ayrı ayrı yönet",f:openMyAssets});
  return page;
})};
function socialFame(){
  const accounts=S&&S.socialMedia?Object.values(S.socialMedia):[];
  const followers=accounts.reduce((sum,a)=>sum+Math.max(0,Number(a.followers)||0),0);
  return Math.min(100,Math.round(Math.sqrt(followers/1000000)*100));
}

const SOCIAL_POST_TYPES=[
 {id:"daily",name:"📸 Günlük hayat",risk:.15,boost:1},
 {id:"comedy",name:"😂 Eğlenceli paylaşım",risk:.22,boost:1.4},
 {id:"tutorial",name:"💡 Bilgilendirici içerik",risk:.12,boost:1.1},

 {id:"opinion",name:"💬 Tartışmalı yorum",risk:.45,boost:2}
];
function socialPostTypes(id){
  if(id==="lifefans")return[{id:"fanphoto",name:"📷 Fotoğraf paylaşımı",risk:.15,boost:1.2},{id:"fanvideo",name:"🎬 Özel video",risk:.2,boost:1.5},{id:"backstage",name:"✨ Kamera arkası",risk:.12,boost:1},{id:"fanlive",name:"🔴 Abonelere canlı yayın",risk:.25,boost:1.7}];
  if(id==="lifehub")return[{id:"hubvideo",name:"🎬 Video yükle",risk:.23,boost:1.5},{id:"hubclip",name:"▶️ Kısa klip",risk:.18,boost:1.2},{id:"hubseries",name:"📺 Video serisi",risk:.27,boost:1.8},{id:"hubpreview",name:"🎞️ Tanıtım videosu",risk:.12,boost:1}];
  return SOCIAL_POST_TYPES;
}
function socialAdultAccess(id){const platform=SOCIAL_PLATFORMS.find(p=>p.id===id);return !platform||!platform.adult||S.age>=18}
function openSocialPostSettings(id){
  const life=S,account=S.socialMedia&&S.socialMedia[id];if(!account||!socialAdultAccess(id)||S.dead)return;
  const fans=id==="lifefans";
  const options=fans?[{id:"subscribers",name:"Yalnızca aboneler"},{id:"public",name:"Herkese açık tanıtım"}]:[{id:"public",name:"Herkese açık"},{id:"unlisted",name:"Listelenmemiş video"}];

  }})).concat([{t:"Vazgeç"}]));
}
function chooseSocialPost(id){
  if(!socialAdultAccess(id))return;
  const account=S.socialMedia&&S.socialMedia[id];if(!account||S.dead)return;
  if(account.year!==S.age){account.year=S.age;account.yearPosts=0}
  if(account.yearPosts>=3)return modal("İçerik paylaş","Bu yıl üç paylaşım yaptın. Gelecek yıl tekrar paylaşabilirsin.",[{t:"Kapat",p:1}]);
  modal("İçerik paylaş","Nasıl bir gönderi paylaşmak istiyorsun? Paylaşımına gelen tepkiye göre takipçi kazanabilir veya kaybedebilirsin.",socialPostTypes(id).map(type=>({t:type.name,f:()=>publishSocialPost(id,type.id)})).concat([{t:"Vazgeç"}]));
}
function publishSocialPost(id,typeId){
  const account=S.socialMedia&&S.socialMedia[id],type=socialPostTypes(id).find(t=>t.id===typeId),platform=SOCIAL_PLATFORMS.find(p=>p.id===id);
  if(!account||!type||!platform||S.dead||!socialAdultAccess(id))return;
  if(account.year!==S.age){account.year=S.age;account.yearPosts=0}
  if(account.yearPosts>=3)return chooseSocialPost(id);
  const privatePost=platform.adult&&((account.audience||(id==="lifefans"?"subscribers":"public"))!=="public");
  account.posts++;account.yearPosts++;
  const before=account.followers,negative=Math.random()<type.risk,viral=!negative&&Math.random()<.08;
  let delta=negative?-Math.max(1,Math.round(before*(.02+Math.random()*.06))):Math.round((rnd(30,180)*(1+(S.g+S.z)/200)+before*(.02+Math.random()*.06))*type.boost*(viral?4:1));
  if(privatePost&&delta>0)delta=Math.round(delta*.35);
  if(id==="lifefans"&&delta>0)delta=Math.round(delta*(lifeFansMonthlyFee(account)>0?GAME_BALANCE.paidFanAcquisition:1)/(1+lifeFansMonthlyFee(account)/100));
  account.followers=Math.max(0,before+delta);delta=account.followers-before;
  apply({m:delta<0?-2:1});
  const text=platform.name+" · "+type.name+"\n"+(viral?"Gönderin viral oldu! ":negative?"Paylaşımın beklediğin tepkiyi almadı. ":"Paylaşımın beğenildi. ")+(delta>0?delta.toLocaleString("tr-TR")+" "+platform.followersLabel.toLocaleLowerCase("tr-TR")+" kazandın.":delta<0?(-delta).toLocaleString("tr-TR")+" "+platform.followersLabel.toLocaleLowerCase("tr-TR")+" kaybettin.":platform.followersLabel+" sayın değişmedi.")+"\nToplam: "+account.followers.toLocaleString("tr-TR")+" "+platform.followersLabel.toLocaleLowerCase("tr-TR")+".";
  line(text.replace(/\n/g," "),delta<0?"bad":"good");render();pgDraw();modal("Paylaşım sonucu",text,[{t:"Kapat",p:1}]);maybeSocialSponsorship(id);
}
function maybeSocialSponsorship(id){
  const life=S,account=S.socialMedia&&S.socialMedia[id],platform=SOCIAL_PLATFORMS.find(p=>p.id===id);
  if(!account||!platform||S.dead||S.age<18||account.followers<1000||S.brandOfferYear===S.age)return;
  const chance=Math.min(.8,.2+Math.log10(account.followers/1000+1)*.18);if(Math.random()>=chance)return;
  S.brandOfferYear=S.age;
  const brand=R(["MaviRota Giyim","NovaTek","FreshUp","FitNova","Luna Bakım","PixelBox"]);
  const fee=Math.round(Math.min(100000,500+account.followers*(.025+Math.random()*.025))*(CD[S.home]||CD["Türkiye"]).w);
  const offer={brand,fee,year:S.age,status:"pending"};account.brandOffer=offer;
  queueResultNotice("Marka iş birliği",brand+", "+platform.name+" hesabında reklam paylaşman için "+TL(fee)+" teklif ediyor. Kabul ediyor musun?",[
    {t:"İş birliğini kabul et",p:1,f:()=>{
      if(S!==life||S.dead||!S.socialMedia||S.socialMedia[id]!==account||offer.status!=="pending")return;
      if(S.age!==offer.year){offer.status="expired";return modal("İş birliği","Bu teklifin süresi doldu.",[{t:"Kapat",p:1}])}
      offer.status="accepted";S.p+=fee;account.posts++;
      const text=brand+" iş birliğinden "+TL(fee)+" kazandın.";line(text,"gold");render();pgDraw();modal("İş birliği sonucu",text,[{t:"Kapat",p:1}]);
    }},
    {t:"Reddet",f:()=>{if(S!==life||offer.status!=="pending")return;offer.status="rejected";line(brand+" teklifini reddettin.");render()}}
  ]);
}
function advanceSocialMedia(){
  if(!S.socialMedia||S.dead||S.socialGrowthAge===S.age)return;
  S.socialGrowthAge=S.age;const messages=[];
  Object.entries(S.socialMedia).forEach(([id,account])=>{
    const active=account.year===S.age-1?(account.yearPosts||0):0;
    const before=account.followers;
    let gain=Math.round(rnd(2,10)+active*rnd(5,20)+account.followers*(active?.01+Math.random()*.03:.002+Math.random()*.008));
    if(id==="lifefans"){const fee=lifeFansMonthlyFee(account);gain=Math.round(gain*(fee>0?GAME_BALANCE.paidFanAcquisition:1)/(1+fee/100));if(fee>0)gain-=Math.round(account.followers*(GAME_BALANCE.fanChurn+Math.min(.20,fee/2500)))}
    account.followers=Math.max(0,account.followers+gain);gain=account.followers-before;account.year=S.age;account.yearPosts=0;
    const platform=SOCIAL_PLATFORMS.find(p=>p.id===id);messages.push((platform?platform.name:id)+": "+(gain>=0?"+":"")+gain.toLocaleString("tr-TR")+" "+(platform?platform.followersLabel.toLocaleLowerCase("tr-TR"):"takipçi")+" · Toplam "+account.followers.toLocaleString("tr-TR"));
    if(id==="lifefans"&&lifeFansMonthlyFee(account)>0&&S.age>=18){const income=Math.round((before+account.followers)/2*lifeFansMonthlyFee(account)*12*.8);S.p+=income;account.subscriptionIncome=income;messages.push("LifeFans abonelik geliri: +"+TL(income)+" (%20 komisyon sonrası)")}
  });
  if(messages.length){line("Sosyal medya: "+messages.join(" · "),"good");render()}
  Object.keys(S.socialMedia).forEach(maybeSocialSponsorship);
}

<script>
// Automatically resume the latest life independently of manual save slots.
const AUTO_KEY="hs_autosave";
let autoSaveQueued=false;
function saveCurrentLife(){
  if(!S)return;
  try{localStorage.setItem(AUTO_KEY,JSON.stringify({version:1,S,log:$("log").innerHTML,home:HOME,snap:SNAP,lg:LG,t:Date.now()}))}catch(e){}
}
function queueLifeSave(){
  if(autoSaveQueued)return;
  autoSaveQueued=true;
  queueMicrotask(()=>{autoSaveQueued=false;saveCurrentLife()});
}
function resumeCurrentLife(){
  let d;
  try{d=JSON.parse(localStorage.getItem(AUTO_KEY))}catch(e){return false}
  if(!d||d.version!==1||!d.S||typeof d.S.name!=="string"||!Number.isFinite(d.S.age)||!Array.isArray(d.S.people)||!Array.isArray(d.S.assets)||typeof d.log!=="string"||!CD[d.S.home])return false;
  S=d.S;HOME=CD[d.home]?d.home:S.home;
  SNAP=Array.isArray(d.snap)?d.snap:[];LG=Number.isFinite(d.lg)?d.lg:0;
  $("log").innerHTML=d.log;render();$("log").scrollTop=1e9;
  if(S.dead)dm();
  return true;
}
const renderBeforeAutoSave=render;
render=function(){const result=renderBeforeAutoSave();queueLifeSave();return result};
document.addEventListener("click",queueLifeSave,true);
document.addEventListener("change",queueLifeSave,true);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")saveCurrentLife()});
window.addEventListener("pagehide",saveCurrentLife);
window.addEventListener("beforeunload",saveCurrentLife);
if(!resumeCurrentLife())start();
saveCurrentLife();
setTimeout(()=>{const l=$("ld");l.classList.add("off");setTimeout(()=>l.remove(),600)},2000);
</script>
