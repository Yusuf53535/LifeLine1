<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0f0a1a">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Lifeline</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap">
<style>
:root{--bg:#1c1c1e;--card:#202a36;--ink:#f1f5f7;--mut:#9fb0ba;--ac:#17c3b8;--gold:#33d65a;--red:#ff6b6b;--line:#33424f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column}
.top{background:#000;padding:10px 14px;display:flex;align-items:center;gap:12px}
.menu{width:34px;height:34px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;font-size:18px}
.logo{font:800 26px/1 "Bricolage Grotesque",system-ui,sans-serif;color:#f26a21;letter-spacing:.5px}
.who{background:#2b3544;padding:8px 12px;display:flex;align-items:center;gap:10px}
.av{width:44px;height:44px;border-radius:50%;background:#8a5a3c;display:grid;place-items:center;font-size:26px;flex:none}
.wi{flex:1;min-width:0}
#name{color:var(--ac);font-weight:800;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#meta{color:var(--ac);font-size:14px;opacity:.85}
.mn{text-align:right}
#money{color:var(--gold);font-weight:800;font-size:22px}
.mn small{color:var(--ac);font-size:12px}
#log{flex:1;overflow-y:auto;padding:8px 14px}
.yr{font-weight:800;font-size:17px;color:var(--ac);margin:16px 0 3px}
.ln{margin:3px 0}
.ln.bad{color:var(--red)}.ln.gold{color:var(--gold)}
nav{background:#012a4a;display:grid;grid-template-columns:1fr 1fr 1.25fr 1fr 1fr;align-items:end;border-top:1px solid #0b4a7a;position:relative}
nav button{background:none;color:var(--ink);border-radius:0;padding:10px 2px 8px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:5px}
nav button i{font-style:normal;width:38px;height:38px;border-radius:50%;background:#17c3b8;display:grid;place-items:center;font-size:18px}
#jobb i{background:#f2862a}
#next{background:#05a02a;color:#fff;width:92px;height:92px;border-radius:50%;border:5px solid #fff;margin:-34px auto 4px;padding:0;gap:0;justify-content:center;font:800 20px/1 "Bricolage Grotesque",system-ui,sans-serif;z-index:2}
#next span{font-size:42px;line-height:.9}
.stats{padding:12px 14px 16px}
.sr{display:flex;align-items:center;gap:10px;margin:6px 0}
.sr em{width:84px;text-align:right;color:var(--ac);font-weight:800;font-style:normal}
.sr u{text-decoration:none;font-size:24px;width:30px;text-align:center}
.sb{flex:1;position:relative;height:24px;background:#3a3a3c;border-radius:3px;overflow:hidden}
.sb b{position:absolute;left:0;top:0;bottom:0;transition:width .4s}
.sb span{position:absolute;right:8px;top:0;line-height:24px;font-weight:800;color:#fff;font-size:14px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 14px;color:var(--ink);background:var(--line)}
button:focus-visible{outline:3px solid #edae49;outline-offset:2px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
#modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:400px;border-radius:20px;padding:20px 16px;max-height:80%;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.5);animation:pop .32s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{font:800 20px "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 6px;color:var(--ac)}
.sheet p{margin:0 0 12px;color:var(--mut)}
.sheet button{display:block;width:100%;text-align:left;margin-top:8px;background:#2b3a49}
.sheet button small{display:block;color:var(--mut);font-size:12px}
.sheet button.p{background:#05a02a;color:#fff;text-align:center;font-weight:800}
#occ,#rls,#mnu,#pg{position:fixed;inset:0;background:#202124;display:none;flex-direction:column;z-index:4;max-width:480px;margin:0 auto;padding-top:env(safe-area-inset-top,0px)}
#occ.on,#rls.on,#mnu.on,#pg.on{display:flex}
.fm{padding:16px}.fm label{display:block;margin:12px 0 4px;color:var(--ac);font-weight:800}
.fm input,.fm select{width:100%;padding:12px;border-radius:10px;border:1px solid #33424f;background:#2b3a49;color:var(--ink);font:inherit}
.fm .go{margin-top:18px;width:100%;background:#05a02a;color:#fff;font-weight:800;text-align:center}
.menu{background:none;color:#fff;padding:0;font-size:18px}
.oh{background:#012a4a;display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid #0b4a7a}
.oh .x{width:34px;height:34px;border:2px solid #fff;border-radius:50%;background:none;padding:0;display:grid;place-items:center;font-size:18px;color:#fff}
.oh h2{flex:1;text-align:center;margin:0 46px 0 0;font:800 22px "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:1px;color:#fff}
.ol{flex:1;overflow-y:auto}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border-radius:0;background:#1f2023;border-bottom:1px solid #33363b;padding:16px 14px;color:var(--ink)}
.row .ic{font-size:34px;width:44px;text-align:center}
.row .tx{flex:1}.row .tx b{display:block;color:#3fb7ff;font-size:20px}.row small{color:#bfe3f7;font-size:15px}
.row .ch{color:#3fb7ff;font-size:30px}
.row.cur{background:#10314d}
.pf{height:8px;background:#3a3a3c;border-radius:4px;margin-top:6px;overflow:hidden}
.pf i{display:block;height:100%;background:#27a844}
#rls .tx b{display:inline}
.rl{color:#bfe3f7;font-weight:400;font-size:19px}
.row small{display:block}
.rb{display:inline-block;width:52%;height:14px;background:#3a3a3c;vertical-align:middle;margin-left:8px;overflow:hidden;border-radius:2px}
.rb i{display:block;height:100%;background:#27a844}
.sec{background:#2b3544;text-align:center;font-weight:700;padding:8px;color:#cdd7de}
.row:disabled{opacity:1}
*{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,select{-webkit-user-select:text;user-select:text}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes fadeIn{from{opacity:0}}
@keyframes lineIn{from{opacity:0;transform:translateY(10px)}}
#occ.on,#rls.on,#mnu.on,#pg.on{animation:slideIn .3s cubic-bezier(.2,.8,.2,1)}
#modal.on{animation:fadeIn .2s ease-out}
.yr,.ln{animation:lineIn .35s ease-out both}
#next{transition:transform .12s}
#next:active{transform:scale(.9)}
.row:active{background:#2a3038}
button{transition:transform .14s cubic-bezier(.34,1.56,.64,1),background .15s}
button:active{transform:scale(.94)}
nav button i{transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
nav button:active i{transform:scale(1.28) rotate(-8deg)}
.row:active{transform:scale(.98)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body{background:#0f0a1a}
body::before{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;background:radial-gradient(circle at 18% 12%,rgba(91,52,160,.55) 0,transparent 45%),radial-gradient(circle at 88% 32%,rgba(120,60,130,.35) 0,transparent 42%),radial-gradient(circle at 28% 88%,rgba(50,60,130,.4) 0,transparent 45%),radial-gradient(circle at 80% 85%,rgba(80,45,140,.4) 0,transparent 42%);animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(6%,-5%) rotate(8deg) scale(1.1)}}

.sb,.pf,.rb{background:rgba(255,255,255,.14);box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}

nav button i{background:linear-gradient(145deg,rgba(255,255,255,.45),rgba(167,139,250,.55));border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 4px 12px rgba(124,58,237,.4)}
#jobb i{background:linear-gradient(145deg,rgba(255,255,255,.45),rgba(240,171,252,.6))}

#occ,#rls,#mnu,#pg{background:rgba(20,10,40,.5);-webkit-backdrop-filter:blur(28px) saturate(150%);backdrop-filter:blur(28px) saturate(150%)}
.oh{background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.06));-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.22);border-top:0;box-shadow:inset 0 -1px 0 rgba(255,255,255,.2),0 8px 24px rgba(20,0,50,.35)}

/* yükleme ekranı */
#ld{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#3b1f6b 0,#150d26 60%,#0b0716 100%);transition:opacity .55s ease}
#ld.off{opacity:0;pointer-events:none}
.ldb{display:flex;flex-direction:column;align-items:center;gap:14px;padding:32px 40px;border-radius:30px;background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.04));-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 20px 50px rgba(10,0,30,.6)}
.ldp{fill:none;stroke:#d8b4fe;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:330;stroke-dashoffset:330;animation:ldDraw 1.3s ease-in-out infinite;filter:drop-shadow(0 0 6px #a78bfa)}
@keyframes ldDraw{0%{stroke-dashoffset:330}60%,100%{stroke-dashoffset:0}}
.ldt{font:800 34px "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:1px;background:linear-gradient(90deg,#fff,#d8b4fe);-webkit-background-clip:text;background-clip:text;color:transparent}
.ldbar{width:180px;height:6px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.ldbar i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,#a78bfa,#f0abfc);animation:ldFill 1.9s ease-out forwards}
@keyframes ldFill{to{width:100%}}
#ld small{color:var(--mut);font-size:13px}
@media (prefers-reduced-motion:reduce){.ldp{stroke-dashoffset:0}.ldbar i{width:100%}}

<script>
const $=id=>document.getElementById(id);
const R=a=>a[Math.floor(Math.random()*a.length)];
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const cl=v=>Math.max(0,Math.min(100,Math.round(v)));
const CTR={"Türkiye":{c:"₺",r:1},"ABD":{c:"$",r:42},"Almanya":{c:"€",r:48},"İngiltere":{c:"£",r:56},"Japonya":{c:"¥",r:.28},"BAE":{c:"AED",r:11.4}};
const LOC=()=>(S&&S.loc)||{city:S?S.city:"",ctry:"Türkiye"};

    e.innerHTML="<span></span>"+(b.sub?"<small></small>":"");e.firstChild.textContent=b.t;if(b.sub)e.querySelector("small").textContent=b.sub;

    const tx=fxTxt(fx);
    line(m+(tx?" ("+tx+")":""),(fx.h<0||fx.m<0||fx.p<0)?"bad":"good");

    if(c.run)c.run();
    render();check();}})));

function doAct(it){
  if(S.age<it.a)return modal(it.t,it.a+" yaşından sonra yapabilirsin.",[{t:"Kapat",p:1}]);
  if(it.special==="orient")return orientMenu();
  if(it.special==="travel")return travel();
  if(S.jail>0)return modal(it.t,"Hapisteyken bunu yapamazsın.",[{t:"Kapat",p:1}]);
  if(it.crime)return crime(it);
  if(it.special==="kill")return pickTarget(false);
  if(it.special==="hit")return pickTarget(true);
  if(it.cas)return casino(it.cas);
  if(it.gamble){
    const [bet,pr,mul]=it.gamble;
    if(S.p<bet){line("Yeterli paran yok.","bad");return}
    if(Math.random()<pr){const g=Math.round(bet*(mul-1));S.p+=g;line("Kazandın! (+"+TL(g)+")","gold")}
    else{S.p-=bet;S.m=cl(S.m-3);line("Kaybettin. (-"+TL(bet)+", -3 mutluluk)","bad")}
    render();return}
  const cost=S.age>=18?(it.c||0):0;
  if(S.p<cost){line("Yeterli paran yok.","bad");return}
  S.p-=cost;
  let fx=it.fx,msg=it.msg;
  if(it.risk&&Math.random()<it.risk[0]){fx=it.risk[1];msg="İşlem kötü sonuçlandı."}
  apply(fx);
  line(msg+" ("+(cost?"-"+TL(cost)+", ":"")+fxTxt(fx)+")",(fx.h<0||fx.m<0)?"bad":"good");
  render();check();
}

function classmate(q){
  const isP=S.partner&&S.partner.from===q.id,b=[],a=S.age;
  b.push({t:"Sohbet et",sub:"Bağ artar · +1 mutluluk",f:()=>{q.b=cl(q.b+6);apply({m:1});line(q.n+" ile sohbet ettin. (+1 mutluluk)","good");render()}});
  if(!q.friend)b.push({t:"Arkadaş ol",sub:"Şansın bağa göre",f:()=>{
    if(Math.random()<.55+q.b/200){q.friend=true;q.b=cl(q.b+15);if(!S.people.includes(q))S.people.push(q);line(q.n+" ile arkadaş oldun.","gold")}
    else{q.b=cl(q.b-3);line(q.n+" arkadaşlık teklifini kabul etmedi.","bad")}render()}});
  if(!isP&&a>=14)b.push({t:"Sevgili ol",sub:S.partner?"Zaten bir ilişkin var":!okG(q.f)?"Yönelimine uygun değil":"Şansın görünüm ve bağa göre",f:()=>{
    if(S.partner)return modal(q.n,"Zaten bir ilişkin var. Önce ilişkiyi bitirmelisin.",OK);
    if(!okG(q.f))return modal(q.n,"Bu kişi cinsel yönelimine uygun değil. Yönelimini Aktiviteler > Kimlik bölümünden değiştirebilirsin.",OK);
    if(Math.random()<.25+S.g/250+q.b/250+(q.friend?.15:0)){S.partner={n:q.n,b:cl(Math.max(50,q.b)),f:q.f,from:q.id};apply({m:8});line(q.n+" ile çıkmaya başladınız. (+8 mutluluk)","gold")}
    else{q.b=cl(q.b-6);apply({m:-2});line(q.n+" teklifini reddetti. (-2 mutluluk)","bad")}render()}});
  b.push({t:"Birlikte çalış",sub:"+3 not · bağ artar",f:()=>{q.b=cl(q.b+8);S.gpa=cl(S.gpa+3);apply({m:-1});line(q.n+" ile birlikte ders çalıştın. (+3% not, -1 mutluluk)","good");render()}});
  if(a>=8)b.push({t:"Kopya iste",sub:"Yakalanma riski var",f:()=>{
    if(Math.random()<q.b/100*.8){S.gpa=cl(S.gpa+4);q.b=cl(q.b-2);line(q.n+" sana kopya verdi. (+4% not)","good")}
    else{S.gpa=cl(S.gpa-5);apply({m:-4});q.b=cl(q.b-5);line("Kopya çekerken yakalandın! (-5% not, -4 mutluluk)","bad")}render()}});
  b.push({t:"Kavga et",sub:"Bağ düşer · -3 sağlık, -3 mutluluk",f:()=>{q.b=cl(q.b-25);apply({h:-3,m:-3});line(q.n+" ile kavga ettin. (-3 sağlık, -3 mutluluk)","bad");render();check()}});
  if(a>=18)b.push({t:"Hediye al",sub:"-3.000 ₺",f:()=>{if(S.p<3000){line("Yeterli paran yok.","bad");return}S.p-=3000;q.b=cl(q.b+10);apply({m:2});line(q.n+" için hediye aldın. (-3.000 ₺, +2 mutluluk)","good");render()}});
  b.push(...OK);
  relWrap(b);
  modal(q.n,"Sınıf arkadaşı · "+q.pa+" yaşında · bağ "+q.b+"/100",b);
}
function jailTerm(y,why){
  S.jail=y;S.job=null;apply({m:-10});PG=[];$("pg").classList.remove("on");
  line((why||"Yakalandın")+"! "+y+" yıl hapis cezası aldın. (-10 mutluluk)","bad");
}
function crime(it){
  const c=it.crime;
  if(Math.random()<c.p){
    const g=c.g[1]?rnd(c.g[0],c.g[1]):0;S.p+=g;apply({m:c.m||2});
    line(c.kill?"Bir cinayet işledin ve yakalanmadın. (-12 mutluluk)":it.t+": başardın. (+"+TL(g)+")",c.kill?"bad":"gold");
  }else if(Math.random()<.75)jailTerm(rnd(c.j[0],c.j[1]),it.t+" sırasında yakalandın");
  else line(it.t+" girişimin başarısız oldu ama yakalanmadın.","bad");
  render();check();
}
function killed(q){
  if(q.partner){S.partner=null;S.married=false}
  else{q.dead=true;q.died=S.age}
  (S.people||[]).forEach(x=>{if(!x.dead)x.b=cl(x.b-15)});
}
function doKill(q,hit){
  const fam=q.partner||["Anne","Baba","Kız kardeş","Erkek kardeş"].includes(q.role);
  PG=[];$("pg").classList.remove("on");
  if(hit){
    const cost=rnd(500000,1000000);
    if(S.p<cost){line("Kiralık katil "+TL(cost)+" istedi, yeterli paran yok.","bad");render();return}
    S.p-=cost;
    if(Math.random()<.8){killed(q);apply({m:-10});line("Kiralık katil işini bitirdi, "+q.n+" öldü. (-"+TL(cost)+", -10 mutluluk)","bad");
      if(Math.random()<.18)jailTerm(rnd(6,14),"Azmettirici olarak yakalandın")}
    else line("Kiralık katil işi başaramadı, parayı da geri alamadın. (-"+TL(cost)+")","bad");
  }else{
    killed(q);apply({m:-15});
    if(Math.random()<(fam?.4:.55))line(q.n+" öldü ve hakkında şüphelenilmedin. (-15 mutluluk)","bad");
    else jailTerm(rnd(15,30),q.n+" cinayetinden yakalandın");
  }
  render();check();
}
function pickTarget(hit){
  pgOpen(()=>{
    const pool=[...(S.people||[]).filter(x=>!x.dead),...S.cls.filter(x=>!x.dead&&!(S.people||[]).includes(x))];
    const rows=pool.map(q=>({ic:pface(q),t:q.n,d:q.role+" · "+q.pa+" yaşında",f:()=>modal(q.n,hit?"Kiralık katil 500.000-1.000.000 ₺ istiyor. Devam edilsin mi?":"Bu geri dönüşü olmayan bir karar. Yakalanırsan uzun yıllar hapis yatarsın.",[{t:hit?"Katil tut":"Devam et",f:()=>doKill(q,hit)},{t:"Vazgeç",p:1}])}));
    if(S.partner)rows.unshift({ic:"💔",t:S.partner.n,d:S.married?"Eşin":"Sevgilin",f:()=>modal(S.partner.n,hit?"Kiralık katil 500.000-1.000.000 ₺ istiyor. Devam edilsin mi?":"Bu geri dönüşü olmayan bir karar.",[{t:hit?"Katil tut":"Devam et",f:()=>doKill({n:S.partner.n,role:S.married?"Eş":"Sevgili",partner:true},hit)},{t:"Vazgeç",p:1}])});
    return {title:hit?"KİRALIK KATİL":"HEDEF SEÇ",intro:'<div class="row cur"><span class="ic">⚠️</span><span class="tx"><b>Ağır sonuçlar</b><small>Hapis, mutluluk kaybı ve aile ilişkilerinde zarar</small></span></div>',rows};
  });
}

const RED=[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
const CAS={
 yt:{ic:"🪙",n:"Yazı Tura",d:"Bir yüz seç. Doğru bilirsen bahsin 2 katını alırsın. Kazanma şansı %47.",opts:[{t:"Yazı",a:"Yazı"},{t:"Tura",a:"Tura"}],
  roll:a=>{const o=a==="Yazı"?"Tura":"Yazı",w=Math.random()<.47;return{mult:w?2:0,txt:"Para "+(w?a:o)+" geldi."}}},
 rk:{ic:"🎡",n:"Rulet: Renk",d:"Kırmızı ya da siyahı seç. Tutarsa 2 kat. Sıfır (yeşil) kasaya gider. Şans yaklaşık %49.",opts:[{t:"Kırmızı",a:"Kırmızı"},{t:"Siyah",a:"Siyah"}],

 rs:{ic:"🎯",n:"Rulet: Sayı",d:"0-36 arası bir sayı seç. Tutarsa 36 kat! Şans yaklaşık %2,7.",num:1,opts:[{t:"Oyna"}],

 sl:{ic:"🎰",n:"Slot makinesi",d:"3 sembol aynıysa 10 kat, üç yedi gelirse 20 kat. İki sembol tutarsa bahsin %80'i geri gelir.",opts:[{t:"Çevir"}],
  roll:()=>{const sy=["🍒","🍋","🔔","⭐","7️⃣"],r=[R(sy),R(sy),R(sy)],u=new Set(r).size,t=r.join(" ");
   if(u===1)return{mult:r[0]==="7️⃣"?20:10,txt:t+" — Jackpot!"};

function casPlay(gid,arg,bet){
  const G=CAS[gid];
  if(S.p<bet){line("Yeterli paran yok.","bad");return casino(gid)}
  S.p-=bet;
  const r=G.roll(arg),back=Math.round(bet*r.mult),net=back-bet;
  S.p+=back;
  let msg;
  if(net>0){apply({m:2});msg=r.txt+" Kazandın! +"+TL(net);line(msg,"gold")}
  else if(net<0&&back>0){apply({m:-1});msg=r.txt+" Bahsin bir kısmını geri aldın. -"+TL(-net);line(msg,"bad")}
  else{apply({m:-3});msg=r.txt+" Kaybettin. -"+TL(bet);line(msg,"bad")}
  render();check();
  if(S.dead)return;
  casino(gid,msg,bet);
}
function casino(gid,msg,prev){
  const G=CAS[gid],mn=1000;
  if(S.p<mn){$("modal").classList.remove("on");line("Kumar oynamak için en az "+TL(mn)+" gerekir.","bad");return}
  const mx=Math.max(mn,Math.min(Math.floor(S.p/1000)*1000,20000000));
  const nice=v=>{if(v>=mx)return mx;const m=Math.pow(10,Math.max(0,String(Math.round(v)).length-2));return Math.min(mx,Math.max(mn,Math.round(v/m)*m))};
  const at=v=>mx<=mn?mn:nice(mn*Math.pow(mx/mn,v/100));
  const pos=prev&&mx>mn?Math.round(Math.max(0,Math.min(100,100*Math.log(Math.min(prev,mx)/mn)/Math.log(mx/mn)))):0;
  const s=$("sheet");s.style.animation="none";void s.offsetWidth;s.style.animation="";
  s.innerHTML=`<h2>${G.ic} ${G.n}</h2><p>${G.d}</p><div class="bet"><div class="bv" id="bv"></div><input type="range" id="br" min="0" max="100" value="${pos}" aria-label="Bahis miktarı"><div class="bm"><span>${TL(mn)}</span><span>${TL(mx)}</span></div></div>${G.num?'<label for="cn" style="color:var(--mut)">Sayın (0-36)</label><input type="number" id="cn" min="0" max="36" value="7">':""}<div class="cres" id="cres"></div><div class="cgrid" id="cg"></div><button class="p" id="cx" style="margin-top:10px">Kapat</button>`;
  const br=$("br"),bv=$("bv"),upd=()=>{bv.textContent=TL(at(+br.value))};
  br.oninput=upd;upd();
  const cr=$("cres");cr.textContent=msg||"";cr.style.color=msg&&/Kazandın/.test(msg)?"var(--gold)":"var(--red)";
  G.opts.forEach(o=>{const e=document.createElement("button");e.textContent=o.t;
    e.onclick=()=>{let a=o.a;if(G.num)a=Math.max(0,Math.min(36,Math.round(+$("cn").value)||0));casPlay(gid,a,at(+br.value))};
    $("cg").appendChild(e)});
  $("cx").onclick=()=>$("modal").classList.remove("on");
  $("modal").classList.add("on");
}
function yksExam(){
  if(S.age<18)return modal("YKS","YKS'ye 18 yaşında girilir.",OK);
  if(S.uni)return modal("YKS","Zaten üniversite okuyorsun.",OK);
  if(S.yksYear===S.age)return modal("YKS","Bu yıl zaten sınava girdin. Yeni sınav gelecek yıl.",OK);
  const tp=cl(S.z*.6+S.tyt*.6+rnd(-6,6)),ap=cl(S.z*.5+S.ayt*.8+rnd(-6,6)),sc=cl(Math.round(tp*.3+ap*.45+S.gpa*.25));
  S.yksScore=sc;S.yksYear=S.age;apply({m:-3});
  line("YKS'ye girdin. Puanın: "+sc+" (-3 mutluluk)",sc>=50?"gold":"bad");
  modal("YKS Sonuçları","TYT: "+Math.round(tp*1.2)+"/120 net\nAYT: "+Math.round(ap*.8)+"/80 net\nDiploma notu: "+S.gpa+"%\nYKS puanın: "+sc,[{t:"Bölüm tercihi yap",sub:"Puanına uygun bölümler",p:1,f:pickDept},{t:"Şimdilik kapat"}]);
  render();
}
function prepYks(){
  const b=[];
  for(const [k,flag,n] of [["tyt","tytD","TYT"],["ayt","aytD","AYT"]])
    b.push({t:n+" çalış",sub:"Hazırlık: "+S[k]+"% · -3 mutluluk, -1 sağlık",f:()=>{
      if(S[flag]){line("Bu yıl "+n+"'ye zaten çok çalıştın.","bad");return}
      S[flag]=true;const g=rnd(10,16);S[k]=cl(S[k]+g);apply({m:-3,h:-1});
      line(n+" çalıştın. (+"+g+"% "+n+", -3 mutluluk, -1 sağlık)","good");render()}});
  b.push(...OK);modal("YKS hazırlık","Ne çalışacaksın? Tahmini puanın: "+yksCalc().s,b);
}
function edu(){
  if(S.age<18)return modal("Eğitim","Üniversite için 18 yaşında olmalısın. YKS'ye 18 yaşında girebilirsin.",OK);
  if(S.uni)return modal("Eğitim","Zaten üniversite okuyorsun.",OK);
  if(S.grad)return modal("Eğitim","Üniversiteden mezunsun.",OK);
  const took=S.yksYear===S.age,b=[
    {t:"YKS'ye gir",sub:took?"Bu yıl girdin":"Yılda bir kez · Puan hazırlığına bağlı",f:yksExam},
    {t:"YKS'ye hazırlan",sub:"TYT "+S.tyt+"% · AYT "+S.ayt+"%",f:prepYks}];
  if(took)b.push({t:"Bölüm tercihi yap",sub:"YKS puanın: "+S.yksScore,f:pickDept});
  b.push(...OK);
  modal("Eğitim",S.yksScore==null?"Üniversiteye girmek için önce YKS'ye girmelisin.":"Son YKS puanın: "+S.yksScore+(took?"":" (eski sınav, tercih için yeniden girmelisin)"),b);
}
const RENT={"İstanbul":45510,"Ankara":34440,"İzmir":33369,"Antalya":29306,"Bursa":24207,"Gaziantep":18000,"Konya":18000,"Trabzon":20000,"Mardin":14000};
const HOMES=["Stüdyo daire","Daire","Villa","Yalı"];
const UPKEEP={"Stüdyo daire":12000,"Daire":18000,"Villa":120000,"Yalı":500000,"Araba":60000,"Sedan":80000,"Spor araba":150000,"Lüks araba":250000,"Sürat teknesi":80000,"Yelkenli":150000,"Yat":600000};
function yearlyCost(){
  const a=S.age,L=LOC(),ps=[],add=(n,v)=>{if(v>0)ps.push([n,v])};
  if(S.street)add("yemek",36000);
  else{
    const own=S.assets.some(n=>HOMES.includes(n));
    const par=(S.people||[]).some(x=>!x.dead&&(x.role==="Anne"||x.role==="Baba"));
    if(a<25&&!S.married&&par&&parAvg()>=40&&!own)add("ailenle yaşıyorsun, kişisel harcamalar",84000);
    else{
      let food=108000,bills=54000;
      if(S.married){food*=1.5;bills*=1.2}
      if(a>=65)food*=.85;
      if(!own){
        if(S.uni)add("yurt",36000);
        else{
          const avg=L.ctry==="Türkiye"?(RENT[L.city]||18000):90000,share=(S.job?S.job.s:0)<600000&&!S.married;
          add(share?"kira, ev arkadaşıyla":"kira",Math.round(avg*(share?.4:.6))*12);
        }
      }
      add("yemek",food);add(S.uni&&!own?"ulaşım ve telefon":"faturalar ve ulaşım",S.uni&&!own?30000:bills);
    }
    if(a>=50)add("sağlık",(a-45)*1500);
    add("mülk ve araç masrafları",S.assets.reduce((t,n)=>t+(UPKEEP[n]||0),0));
  }
  const f=.95+Math.random()*.1;
  ps.forEach(p=>{p[1]=Math.round(p[1]*f/100)*100});
  return{t:ps.reduce((t,p)=>t+p[1],0),d:ps.map(p=>p[0]+" "+TL(p[1])).join(", ")};
}
let POP=null;
const _ln=line;line=function(t,c){_ln(t,c);if(POP)POP.push(t)};

function relWrap(b){b.forEach(x=>{if(x.f)x.f=rp(x.f)})}
